name: Build Wisp.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Wisp
          --hidden-import pystray._win32 --collect-submodules send2trash
          wisp.py
      - name: Package
        shell: pwsh
        run: |
          Copy-Item .env.example dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath Wisp-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Wisp-windows
          path: Wisp-windows.zip
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Wisp-windows.zip
